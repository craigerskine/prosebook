border:
  btn: 1px

input:
  size: 0.25rem

cal:
  width: 15.875rem
  radius: 0.25rem
  day-radius: 0.3125rem
  day-selected: var(--prs-c-primary)

dialog:
  backdrop: 0 0 0 / 0.5

radius:
  alert: 0.25rem
  badge: 1.9rem
  box: 0.75rem
  btn: 0.1875rem
  input: 0

shadow:
  sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05)
  md: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1)
  lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)
  xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)
  2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 15px 20px -5px rgba(0, 0, 0, 0.1)

transition:
  property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, outline-color, box-shadow, transform, filter, backdrop-filter
  timing: cubic-bezier(0.4, 0, 0.2, 1)
  duration: 150ms
